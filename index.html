<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مركز ريفيتا كير</title>
<style>
:root{--g:#2f5233;--g2:#5d7f4f;--t:#b88d5c;--bg:#f6efe4;--card:#fffaf2;--tx:#2b2b24;--ln:#e5d9c6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d241c;--card:#263024;--tx:#f1eadc;--ln:#3a4637;--g:#8fb582}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;max-width:480px;margin-inline:auto;min-height:100vh}
header{text-align:center;padding:18px 16px 8px}
header img{width:210px;max-width:70%;mix-blend-mode:multiply;border-radius:12px}
h1{margin:6px 0 2px;font-size:24px;color:var(--g)}
.dr{color:var(--t);font-size:16px;font-weight:600}
.info{font-size:13px;opacity:.8;margin-top:6px;line-height:1.7}
main{padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
h2{font-size:17px;margin:0 0 12px;color:var(--g)}
label{display:block;font-size:14px;margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border:1px solid var(--ln);border-radius:20px;background:var(--bg);cursor:pointer;font-size:14px}
.chip.on{background:var(--g);color:#fff;border-color:var(--g)}
.go{display:block;text-align:center;text-decoration:none;width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:var(--g);color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.err{color:#b3261e;font-size:13px;margin-top:8px;min-height:16px}
.note{font-size:12px;opacity:.7;text-align:center;margin-top:10px}
</style>
</head>
